<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- A-frame: simple triangle -->
  <polygon points="100,30 15,155 185,155"
        fill="none" stroke="#c8834a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ground line -->
  <line x1="10" y1="155" x2="190" y2="155" stroke="#c8834a" stroke-width="3" stroke-linecap="round"/>

  <!-- Door: triangle cutout at base centre -->
  <polyline points="75,155 100,105 125,155"
        fill="none" stroke="#c8834a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
